name: Build Browserland installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/package.json
      - app/ui/assets/app-icon.*
      - app/scripts/ci-*
      - app/scripts/windows-installer-nsis.nsi
      - app/scripts/build-electron-installer.py
      - app/scripts/verify-ci-windows.py
      - app/tests/test_ci_publish_release.py
      - .github/workflows/build-release.yml

permissions:
  contents: read

concurrency:
  group: browserland-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install build dependency
        run: python -m pip install Pillow==13.0.0
      - name: Verify release publication guards
        run: python -m unittest discover -s app/tests -p test_ci_publish_release.py -v
      - name: Run application tests
        working-directory: app
        run: npm test
      - name: Build and verify Windows installer
        shell: pwsh
        run: ./app/scripts/ci-build-windows.ps1
      - name: Save Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserland-windows
          path: |
            app/dist/Browserland-*-Windows-Setup.exe
            app/dist/Browserland-*-Windows-Portable.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save Windows verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserland-windows-verification
          path: app/reference/*.json
          if-no-files-found: warn
          retention-days: 14

  macos:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install build dependency
        run: python -m pip install Pillow==13.0.0
      - name: Build and verify Intel and Apple Silicon packages
        shell: pwsh
        run: ./app/scripts/ci-build-macos.ps1
      - name: Save Mac packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserland-macos
          path: |
            app/dist/Browserland-*-mac.dmg
            app/dist/Browserland-*-Mac-Portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save Mac verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserland-macos-verification
          path: app/reference/*.json
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browserland-*
          path: release-input
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 app/scripts/ci-publish-release.py release-input
